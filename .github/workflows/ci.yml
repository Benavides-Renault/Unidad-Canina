name: Verificación ORYX K9
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: oryx_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: oryx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oryx_test -d oryx_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://oryx_test:ephemeral-ci-only@127.0.0.1:5432/oryx_test?schema=public
      APP_ORIGIN: http://localhost:3000
      API_URL: http://127.0.0.1:4000
      API_PORT: 4000
      API_HOST: 127.0.0.1
      COOKIE_SECURE: 'false'
      STORAGE_DRIVER: local
      STORAGE_PATH: /tmp/oryx-ci-files
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Clave efímera de cifrado para pruebas
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'APP_ENCRYPTION_KEY='+require('node:crypto').randomBytes(32).toString('hex')+'\n')"
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          COMPANY_SETUP_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:system
      - name: Reportes de pruebas sin datos reales
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
